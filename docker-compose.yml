# Local stack: PostgreSQL 16, a one-shot migration, web (API + SPA) and worker.
#   cp .env.example .env    # optional locally; set real secrets for anything but a trial
#   docker compose up -d --build
#   open http://localhost:8000
name: nchito

x-app: &app
  build: .
  restart: unless-stopped
  environment: &app-env
    ENVIRONMENT: ${ENVIRONMENT:-development}
    DATABASE_URL: postgresql://nchito:${POSTGRES_PASSWORD:-nchito}@db:5432/nchito
    SECRET_KEY: ${SECRET_KEY:-local-dev-secret-change-me}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    BASE_URL: ${BASE_URL:-http://localhost:8000}
    APP_NAME: ${APP_NAME:-Nchito}
    FILES_DIR: /data/files
    BACKUP_DIR: /data/backups
    GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    - files:/data/files
    - backups:/data/backups

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nchito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nchito}
      POSTGRES_DB: nchito
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nchito -d nchito"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["nchito", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    command: ["nchito", "web"]
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["nchito", "worker"]
    healthcheck:
      test: ["CMD", "nchito", "worker-alive"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional server runner (DESIGN.md 8.3, Runner B). OFF by default: start with
  #   docker compose --profile runner up -d runner
  # It spends Anthropic API tokens: the owner's caps apply, under the RUNNER_*_MAX_* ceilings. It exits with a
  # clear error if RUNNER_TOKEN or RUNNER_ANTHROPIC_API_KEY is empty.
  runner:
    profiles: ["runner"]
    build: ./runner/server
    restart: unless-stopped
    environment:
      # The instance as the runner reaches it; the runner adds /mcp. Leave unset on the compose network.
      NCHITO_URL: ${RUNNER_NCHITO_URL:-http://web:8000}
      NCHITO_RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      ANTHROPIC_API_KEY: ${RUNNER_ANTHROPIC_API_KEY:-}
      # Model, caps and step limit come from the owner's settings (get_runner_config). These are this
      # deployment's ceilings; empty = the runner's own default (runner/server/nchito_runner/config.py).
      RUNNER_TASK_MAX_COST_USD: ${RUNNER_TASK_MAX_COST_USD:-}
      RUNNER_DAY_MAX_COST_USD: ${RUNNER_DAY_MAX_COST_USD:-}
      RUNNER_TASK_MAX_TOKENS: ${RUNNER_TASK_MAX_TOKENS:-}
      RUNNER_DAY_MAX_TOKENS: ${RUNNER_DAY_MAX_TOKENS:-}
      RUNNER_POLL_SECONDS: ${RUNNER_POLL_SECONDS:-}
      RUNNER_TASK_KINDS: ${RUNNER_TASK_KINDS:-}
      RUNNER_DRY_RUN: ${RUNNER_DRY_RUN:-}
    volumes:
      - runner_data:/data
    shm_size: "1gb"
    stop_grace_period: 60s
    depends_on:
      - web

volumes:
  runner_data:
  pgdata:
  files:
  backups:
