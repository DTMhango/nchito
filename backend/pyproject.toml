[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nchito"
version = "0.1.0"
description = "Private single-owner job-hunting platform (backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.11",  # Field(exclude_if=...) keeps old packet hashes stable
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "itsdangerous>=2.2",
  "cryptography>=42",
  "procrastinate>=2.15",
  "croniter>=2.0",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "anthropic>=1.2",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "mcp>=1.9,<2",
  "boto3>=1.34",
  "pypdf>=5",
]

[project.optional-dependencies]
jobspy = [
  "python-jobspy>=1.1",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-xdist>=3.6",
  "httpx>=0.27",
  "ruff>=0.6",
  "pypdf>=5",
]

[project.scripts]
nchito = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed", "migrations/*.mako", "migrations/versions/*.py", "themes/*.json", "llm/*.json", "llm/prompt_defaults/*.md", "docs/templates/*.j2"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "TID251"]
ignore = ["S101", "B008", "RUF012", "S105", "S106", "UP042"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The 422 constant was renamed across Starlette releases; use the number so the code runs on any version.
"fastapi.status.HTTP_422_UNPROCESSABLE_CONTENT".msg = "use 422 (constant missing in older Starlette)"
"fastapi.status.HTTP_422_UNPROCESSABLE_ENTITY".msg = "use 422 (constant deprecated in newer Starlette)"
"starlette.status.HTTP_422_UNPROCESSABLE_CONTENT".msg = "use 422 (constant missing in older Starlette)"
"starlette.status.HTTP_422_UNPROCESSABLE_ENTITY".msg = "use 422 (constant deprecated in newer Starlette)"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
