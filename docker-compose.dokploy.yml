# VPS deployment under Dokploy (Traefik terminates TLS). Set these in Dokploy's environment:
#   DOMAIN, SECRET_KEY, ENCRYPTION_KEY (nchito gen-key), POSTGRES_PASSWORD, APP_NAME (optional)
# Secrets are required here: the stack refuses to start without them.
name: nchito

x-app: &app
  build: .
  restart: unless-stopped
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql://nchito:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/nchito
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
    BASE_URL: https://${DOMAIN:?set DOMAIN}
    APP_NAME: ${APP_NAME:-Nchito}
    FILES_DIR: /data/files
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  volumes:
    - files:/data/files
  networks:
    - internal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nchito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nchito
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nchito -d nchito"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["nchito", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    command: ["nchito", "web"]
    expose:
      - "8000"
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.nchito.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.nchito.entrypoints=websecure
      - traefik.http.routers.nchito.tls.certresolver=letsencrypt
      - traefik.http.services.nchito.loadbalancer.server.port=8000
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["nchito", "worker"]
    healthcheck:
      test: ["CMD", "nchito", "worker-alive"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  files:

networks:
  internal:
  dokploy-network:
    external: true
